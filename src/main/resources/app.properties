# ==============================
# Application Security Settings
# ==============================


# Java KeyStore configuration

keystore.path=server.jceks
keystore.password=changeit

keystore.type=JCEKS



# ==============================
# AES Configuration
# ==============================

aes.algorithm=AES

aes.transformation=AES/GCM/NoPadding

aes.key.size=256

aes.iv.size=12

aes.tag.size=128


# TLS

server.name=SWConsulting-Server

network.tls.port=5000
network.discovery.port=5001

tls.keystore=server-keystore.jks
tls.password=changeit

tls.truststore=client-truststore.jks
tls.truststore.password=changeit